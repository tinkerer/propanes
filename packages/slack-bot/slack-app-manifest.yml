# Manifest for the one shared Slack app. In Slack: api.slack.com/apps →
# Create New App → From a manifest → pick the workspace → paste this (rename
# it first if you like; SLACK_BOT_NAME should match the handle).
# Then: Basic Information → App-Level Tokens → generate one with
# connections:write (SLACK_APP_TOKEN, xapp-…); Install App → install to the
# workspace and copy the Bot User OAuth Token (SLACK_BOT_TOKEN, xoxb-…).
display_information:
  name: propanes
  description: ProPanes agent sessions from Slack
features:
  bot_user:
    display_name: propanes
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.customize
      - reactions:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
